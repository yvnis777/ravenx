# /etc/nginx/sites-available/ravenx.app
# HTTP only as shipped: `certbot --nginx` adds the HTTPS server and the redirect.
# .app is HSTS-preloaded, so browsers will only ever load it over HTTPS.

limit_req_zone $binary_remote_addr zone=ravenx_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name www.ravenx.app;
    return 301 https://ravenx.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ravenx.app;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Backend: /api/<path> → Flask /<path> (the trailing slash strips the prefix)
    location /api/ {
        limit_req zone=ravenx_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (/dashboard/traders/stream) must not be buffered
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
